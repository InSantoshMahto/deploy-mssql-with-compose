# ════════════════════════════════════════════════════════════════════════
# SQL Server 2019 Podman Compose Configuration
# ════════════════════════════════════════════════════════════════════════

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-CU32-GDR7-ubuntu-20.04

    container_name: mssql-server-2019
    hostname: sqlserver2019

    # ═══════════════ ROOTLESS MODE SUPPORT ═══════════════
    # Note: user UID:GID mapping is handled automatically by Podman on Linux.
    # On macOS, the container runs in a Podman VM — no user override needed.
    # user: "$(id -u):$(id -g)"  # Uncomment on Linux if needed

    # ════════════════ RESOURCE LIMITS ════════════════════
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 6G
        reservations:
          cpus: "1.0"
          memory: 4G

    environment:
      # Accept End-User Licensing Agreement for SQL Server
      ACCEPT_EULA:
        ${ACCEPT_EULA:-Y}
        # SA user password (must be strong - see .env file)
      SA_PASSWORD:
        ${SA_PASSWORD}
        # SQL Server edition (Developer, Express, Standard, Enterprise, Evaluation)
      MSSQL_PID:
        ${MSSQL_PID:-Developer}
        # Enable SQL Server Agent for scheduled tasks
      MSSQL_AGENT_ENABLED:
        ${MSSQL_AGENT_ENABLED:-true}
        # Set default collation (matches your locale requirements)
      MSSQL_COLLATION:
        ${MSSQL_COLLATION:-SQL_Latin1_General_CP1_CI_AS}
        # Memory limit in MB - tune based on available system RAM
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}

    ports:
      # Expose SQL Server port (default is 1433)
      - "${SQL_PORT:-1433}:1433"

    volumes:
      # Data files - persistent storage for databases and objects
      - mssql-data:/var/opt/mssql/data
      # Log files - transaction logs and audit trails
      - mssql-log:/var/opt/mssql/log
      # Backup directory - mapped to host for easy access and backup automation
      - ./backups:/var/opt/mssql/backups

    networks:
      - mssql-network

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$${SA_PASSWORD}" -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

      # ════════════ PODMAN LOGGING CONFIGURATION ════════════
      # Using k8s-file driver for Podman compatibility
      # - Check logs with: podman logs mssql-server-2019
      # Or: journalctl -u mssql-server-2019 -f -n 50 (systemd journal)
    logging:
      driver: "k8s-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

volumes:
  mssql-data:
    driver: local
    name: mssql-2019-data
    labels:
      io.podman.compose.project: "mssql"
      io.podman.compose.volume: "data"

  mssql-log:
    driver: local
    name: mssql-2019-log
    labels:
      io.podman.compose.project: "mssql"
      io.podman.compose.volume: "log"

networks:
  mssql-network:
    driver: bridge
    name: mssql-network
    labels:
      io.podman.compose.project: "mssql"
