# Compose Specification
# Docker Engine 29.4.0 | Docker Compose v5.1.3
# API version: 1.54

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-CU32-GDR7-ubuntu-20.04

    container_name: mssql-server-2019
    hostname: sqlserver2019
    user: "0:0"

    # Resource limits and reservations
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 6G
        reservations:
          cpus: "1.0"
          memory: 4G

    environment:
      # Accept End-User Licensing Agreement
      ACCEPT_EULA: ${ACCEPT_EULA:-Y}
      # SA user password (must be strong)
      SA_PASSWORD: ${SA_PASSWORD}
      # SQL Server edition (Developer, Express, Standard, Enterprise, Evaluation)
      MSSQL_PID: ${MSSQL_PID:-Developer}
      # Enable SQL Server Agent
      MSSQL_AGENT_ENABLED: ${MSSQL_AGENT_ENABLED:-true}
      # Set default collation
      MSSQL_COLLATION: ${MSSQL_COLLATION:-SQL_Latin1_General_CP1_CI_AS}
      # Memory limit (in MB)
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}

    ports:
      # SQL Server port
      - "${SQL_PORT:-1433}:1433"

    volumes:
      # Data files - persistent storage for databases
      - mssql-data:/var/opt/mssql/data
      # Log files - transaction logs
      - mssql-log:/var/opt/mssql/log
      # Secrets - certificates and keys
      - mssql-secrets:/var/opt/mssql/secrets
      # Backup directory - mapped to host for easy access
      - ./backups:/var/opt/mssql/backups

    networks:
      - mssql-network

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$${SA_PASSWORD}" -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
      start_interval: 5s

    # Security options
    security_opt:
      - no-new-privileges:true

    # Read-only root filesystem with writable tmpfs mounts
    # Commented out as SQL Server requires write access to root
    # read_only: true

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

volumes:
  mssql-data:
    driver: local
    name: mssql-2019-data
    labels:
      com.docker.compose.project: "mssql"
      com.docker.compose.volume: "data"
  mssql-log:
    driver: local
    name: mssql-2019-log
    labels:
      com.docker.compose.project: "mssql"
      com.docker.compose.volume: "log"
  mssql-secrets:
    driver: local
    name: mssql-2019-secrets
    labels:
      com.docker.compose.project: "mssql"
      com.docker.compose.volume: "secrets"

networks:
  mssql-network:
    driver: bridge
    name: mssql-network
    labels:
      com.docker.compose.project: "mssql"
      com.docker.compose.network: "mssql-network"
